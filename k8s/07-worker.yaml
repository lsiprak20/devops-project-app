# Worker - pozadinska obrada, bez HTTP porta. Liveness preko provjere procesa.
# Autor: Lovro Siprak
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ticketing
  labels: { app: worker }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      serviceAccountName: ticketing-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/<OWNER>/ticketing-worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ticketing-config }
          env:
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: ticketing-secret, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ticketing-secret, key: POSTGRES_PASSWORD } } }
          livenessProbe:
            exec: { command: ["sh","-c","pgrep -f worker.js || exit 1"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
