# Ingress - vanjski pristup (zahtjev I6).
# "/"     -> frontend (web UI)
# "/api"  -> api servis. API u kodu sam skida "/api" prefiks (vidi server.js),
#            pa ovdje NE treba rewrite anotacija.
# Autor: Lovro Siprak
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-ingress
  namespace: ticketing
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: ticketing.local      # dodaj u /etc/hosts ili C:\Windows\System32\drivers\etc\hosts
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
